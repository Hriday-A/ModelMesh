{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  <form method="post">
    {% csrf_token %}
    {% include "form_fields.html" with form=form %}
    <button type="submit" class="button full">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
