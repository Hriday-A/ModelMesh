{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {% include "form_fields.html" with form=form %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button full">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</section>
{% endblock %}
